# Publicar el hub SIN abrir una terminal.
#
# Es el mismo resultado que `npm run desplegar` desde el repositorio, pero desde
# el navegador: construye —lo que incluye verificar el repositorio y correr las
# pruebas— y publica el Worker con la portada, el cotizador y el panel de
# clientes dentro.
#
# ── Lo único que hay que crear a mano (una vez) ─────────────────────────────
#
#   CLOUDFLARE_API_TOKEN  · dash.cloudflare.com → Manage Account → API Tokens →
#                           Create Token → plantilla «Edit Cloudflare Workers».
#                           Se guarda en GitHub: Settings → Secrets and
#                           variables → Actions → New repository secret.
#   CLOUDFLARE_ACCOUNT_ID · opcional; solo si ese token ve más de una cuenta.
#                           Se copia de la barra lateral del panel de Workers.
#
# La base de datos NO se toca aquí: sus migraciones tienen su propio flujo
# (`migrar.yml`), y las dos que existen hoy ya están aplicadas.
#
# ── Cómo se dispara ─────────────────────────────────────────────────────────
#
# A mano: pestaña Actions → «Desplegar el hub» → Run workflow, eligiendo la
# rama. Sirve para publicar desde una rama antes de mezclarla.
#
# A propósito NO corre solo en cada empuje, por lo mismo que en el repositorio
# del CRM: sin el token configurado, un flujo automático solo dejaría una cruz
# roja en cada empuje. Si algún día se quiere automático, se añade debajo de
# `workflow_dispatch:`
#
#   push:
#     branches: [main]
#
# ── Después del primer despliegue ───────────────────────────────────────────
#
# El hub queda EN PIE Y CERRADO: mientras `ACCESO_DOMINIO` y `ACCESO_AUD` sigan
# en `PENDIENTE` dentro de `wrangler.jsonc`, el Worker responde 503 a todo. Eso
# es lo correcto y es deliberado —ver `worker/index.ts`—. Para abrirlo hay que
# crear la aplicación en Cloudflare Access sobre este Worker, copiar aquí sus
# dos datos y volver a desplegar. Está explicado en el README.

name: Desplegar el hub

on:
  workflow_dispatch:

# Un despliegue a la vez. Si se encima otro, espera en vez de pisarlo a medias.
concurrency:
  group: desplegar-hub
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que está la llave
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN."
            echo "Se crea en Cloudflare → Manage Account → API Tokens, con la plantilla"
            echo "«Edit Cloudflare Workers», y se guarda en GitHub → Settings → Secrets and"
            echo "variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm run instalar

      # Verifica el repositorio, corre las pruebas y deja `publico/`. Si algo de
      # eso falla, no se publica nada: una herramienta que cotiza mal es peor
      # que una herramienta caída, porque la caída se nota.
      - name: Construir
        run: npm run build

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Vacío cuando el token ve una sola cuenta, que es el caso corriente.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Qué falta para que se pueda entrar
        run: |
          echo "Publicado. Si ACCESO_DOMINIO y ACCESO_AUD siguen en PENDIENTE,"
          echo "el hub responde 503 a todo hasta que se cree la aplicación en"
          echo "Cloudflare Access sobre este Worker y se copien aquí sus dos datos."
