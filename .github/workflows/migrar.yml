# Aplica las migraciones de la base cuando llega una nueva.
#
# El despliegue no lo hace. Cada empuje a `main` publica el código solo
# —Cloudflare Workers Builds— pero la base no se toca: Cloudflare no sabe qué
# hay en `migraciones/`. Si el código nuevo llega a una base sin migrar, el
# historial responde «La operación falló» a todo, porque sus consultas nombran
# columnas que ahí no existen. Armar la propuesta y bajar el PDF siguen
# funcionando; lo que se cae es guardarla.
#
# Hace falta un secreto, que se pone una sola vez:
#
#   1. En Cloudflare, My Profile → API Tokens → Create Token → Create Custom
#      Token. Un solo permiso: Account → D1 → Edit, sobre la cuenta donde vive
#      `panaclaw-propuestas`. Nada más.
#   2. En GitHub, Settings → Secrets and variables → Actions → New repository
#      secret, con nombre `CLOUDFLARE_API_TOKEN`.
#
# A qué cuenta pertenece no se pregunta: sale del `account_id` de
# `wrangler.jsonc`. Sin él, wrangler empieza pidiendo la lista de cuentas del
# usuario y un token acotado a D1 no tiene permiso para leerla: falla antes de
# tocar nada, con un error sobre permisos que no es lo que pasa.

name: Migrar la base

on:
  push:
    branches: [main]
    paths:
      - 'migraciones/**'
      - '.github/workflows/migrar.yml'
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que están los dos datos
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN."
            echo "Se crea en Cloudflare → My Profile → API Tokens, con el permiso Account → D1 → Edit,"
            echo "y se guarda en GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          # El `account_id` se lee del propio wrangler.jsonc para no acabar con
          # el mismo dato escrito en dos sitios que se desincronizan. El
          # subcomando `d1 migrations list` pide la autenticación con una
          # configuración vacía, así que no llega a mirar el archivo y solo le
          # queda esta variable.
          CUENTA=$(grep -oP '"account_id"\s*:\s*"\K[^"]+' wrangler.jsonc || true)
          if [ -z "$CUENTA" ]; then
            echo "Falta \"account_id\" en wrangler.jsonc. Es el identificador de la cuenta de"
            echo "Cloudflare —el mismo que sale en la dirección del panel— y no es un secreto."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CUENTA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Aplicar lo que falte
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # No repite lo ya aplicado: aplica solo las migraciones nuevas.
        run: npm run migrar
