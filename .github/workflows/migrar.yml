# Aplica las migraciones de la base cuando llega una nueva.
#
# El despliegue no lo hace. Cada empuje a `main` publica el código solo
# —Cloudflare Workers Builds— pero la base no se toca: Cloudflare no sabe qué
# hay en `migraciones/`. Si el código nuevo llega a una base sin migrar, el
# historial responde «La operación falló» a todo, porque sus consultas nombran
# columnas que ahí no existen. Armar la propuesta y bajar el PDF siguen
# funcionando; lo que se cae es guardarla.
#
# Hacen falta uno o dos secretos, que se ponen una sola vez en GitHub
# (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN   obligatorio. Es el MISMO secreto que usa el flujo de
#                          publicar: se crea una vez con la plantilla «Edit
#                          Cloudflare Workers» y hay que sumarle el permiso
#                          Account → D1 → Edit, porque aplicar migraciones toca
#                          la base y publicar no.
#
#   CLOUDFLARE_ACCOUNT_ID  solo si ese token ve más de una cuenta. Entonces
#                          wrangler pregunta cuál, y un token acotado a D1 no
#                          tiene permiso para leer la lista de cuentas: falla
#                          antes de tocar nada, con un error sobre permisos que
#                          no es lo que pasa. Se copia de la barra lateral del
#                          panel de Workers.
#
# Es la misma convención que el repositorio del CRM, que se despliega a la
# misma cuenta: el identificador es un dato de quién despliega, no del
# proyecto, así que va por variable y no escrito en `wrangler.jsonc`.

name: Migrar la base

on:
  push:
    branches: [main]
    paths:
      - 'migraciones/**'
      - '.github/workflows/migrar.yml'
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      # Sin llave no se puede aplicar nada, y qué hacer entonces depende de
      # quién llamó:
      #
      #   · Lo lanzó una persona → se para y se dice qué falta. Quien pulsa el
      #     botón espera que pase algo, y un verde que no hizo nada engaña.
      #   · Lo disparó un empuje → se avisa y se sigue en verde. Un repositorio
      #     que todavía no está conectado a Cloudflare es un estado legítimo, y
      #     una cruz roja en cada empuje enseña al equipo a no mirar las cruces
      #     rojas, que es justo lo que no puede pasar el día que una sea de
      #     verdad.
      - name: ¿Está la llave?
        id: llave
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN."
            echo "Se crea en Cloudflare → Manage Account → API Tokens, con la plantilla"
            echo "«Edit Cloudflare Workers» más el permiso Account → D1 → Edit, y se guarda"
            echo "en GitHub → Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No se aplicó ninguna migración: falta el secreto CLOUDFLARE_API_TOKEN.             Mientras no esté, las migraciones nuevas hay que aplicarlas a mano con 'npm run migrar'."
          fi

      - uses: actions/checkout@v4
        if: steps.llave.outputs.hay == 'si'

      - uses: actions/setup-node@v4
        if: steps.llave.outputs.hay == 'si'
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund
        if: steps.llave.outputs.hay == 'si'

      - name: Aplicar lo que falte
        if: steps.llave.outputs.hay == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Vacío cuando el token ve una sola cuenta, que es el caso corriente.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # No repite lo ya aplicado: aplica solo las migraciones nuevas. Las dos
        # primeras ya están puestas, así que hoy no haría nada.
        run: npm run migrar
