# Configuración de Netlify para la VISTA PREVIA del hub.
#
# Este repositorio es sobre todo el cerebro de la marca —`datos/`, `adn/`,
# `catalogo/`, `prompts/`— y nada de eso se publica. Lo único que sale a la web
# es lo que `scripts/construir.mjs` deja en `publico/`: la portada y el
# cotizador ya construido.
#
# ---------------------------------------------------------------------------
# EL HUB DE VERDAD YA NO SE PUBLICA AQUÍ
#
# Desde que el historial y el panel de clientes son compartidos, el hub vive en
# Cloudflare: la base (D1) y la puerta única (Cloudflare Access) están ahí, y
# Netlify no puede dar ninguna de las dos. Ver el README.
#
# Lo que queda aquí es la vista previa, con `VITE_DEMO=1`. Esa marca cambia dos
# cosas: el historial se guarda en el navegador de quien mira —con números
# `PROP-DEMO-0001`, para que ningún PDF de éstos se confunda con uno de verdad—
# y el panel de clientes dice que necesita el servidor en vez de enseñar una
# libreta de mentira.
#
# Cuando Cloudflare esté en pie, esto se apaga: dos copias del hub en pie es
# como alguien acaba cotizando en la que no era.

[build]
  # El `npm install` de raíz no toca `cotizador/`, que es un paquete aparte.
  # Por eso se instala explícitamente antes de construir; sin esto el build
  # falla en Netlify aunque funcione en local, donde las dependencias ya están.
  command = "npm run instalar && npm run build"
  publish = "publico"

[build.environment]
  NODE_VERSION = "22"
  # Sin servidor detrás. Ver la cabecera.
  VITE_DEMO = "1"

# ---------- CABECERAS ----------
# El hub es interno. Va sin caché agresiva para que un despliegue se vea al
# instante, y con `noindex` reforzado desde el servidor: la etiqueta del HTML
# solo protege la portada, y esta cabecera cubre también el cotizador y sus
# archivos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# La excepción: lo que Vite deja en `assets/` lleva un hash en el nombre, así
# que un archivo concreto no cambia nunca —si cambia el contenido, cambia el
# nombre—. Un año de caché inmutable, y las fuentes de Archivo dejan de bajarse
# en cada visita.
[[headers]]
  for = "/cotizador/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
